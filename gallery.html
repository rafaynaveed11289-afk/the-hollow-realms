<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Cover art and concept pieces from The Hollow Realm.">

    <title>Gallery | The Hollow Realm</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Cinzel+Decorative:wght@400;700&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&display=swap"
        rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <!-- Main Stylesheet -->
    <link rel="icon" type="image/png" href="assets/favicon.png">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- ===== LAYERED BACKGROUND ATMOSPHERE ===== -->
    <div class="background" aria-hidden="true"></div>
    <div class="fog" aria-hidden="true"></div>
    <div class="fog-2" aria-hidden="true"></div>


    <!-- ===================================================
         NAVBAR
    =================================================== -->
    <header>
        <nav class="navbar" role="navigation" aria-label="Primary Navigation">

            <a class="logo" href="index.html" aria-label="The Hollow Realm Home">
                THE HOLLOW REALM
            </a>

            <ul class="nav-links">
                <li><a href="index.html" data-nav>HOME</a></li>
                <li><a href="about.html" data-nav>ABOUT</a></li>
                <li><a href="world.html" data-nav>WORLD</a></li>
                <li><a href="characters.html" data-nav>CHARACTERS</a></li>
                <li><a href="gallery.html" data-nav>GALLERY</a></li>
            </ul>

            <a class="login-btn" href="login.html" data-login-btn aria-label="Login to your account">
                <i class="fa-regular fa-user" aria-hidden="true"></i>
                LOGIN
            </a>

        </nav>
    </header>


    <main>

        <section class="page-hero" aria-labelledby="page-title">
            <p class="eyebrow">GALLERY</p>
            <h1 id="page-title">ART &amp; COVERS</h1>
            <p class="lede">
                Maps and concept pieces of The Hollow Realms world.
            </p>
        </section>

        <section class="page-section">
            <div class="gallery-grid gallery-grid--maps">
                <div class="gallery-card">
                    <h3 class="gallery-label">NORTHWESTERN</h3>
                    <button type="button" class="gallery-item" data-caption="Northwestern District">
                        <img src="assets/northwestern-district.png"
                            alt="Map of the northwestern district of The Hollow Realm" loading="lazy">
                    </button>
                </div>

                <div class="gallery-card">
                    <h3 class="gallery-label">NORTHEASTERN</h3>
                    <button type="button" class="gallery-item" data-caption="Northeastern District">
                        <img src="assets/northeastern-district.png"
                            alt="Map of the northeastern district of The Hollow Realm" loading="lazy">
                    </button>
                </div>

                <div class="gallery-card">
                    <h3 class="gallery-label">SOUTHWESTERN</h3>
                    <button type="button" class="gallery-item" data-caption="Southwestern District">
                        <img src="assets/southwestern-district.png"
                            alt="Map of the southwestern district of The Hollow Realm" loading="lazy">
                    </button>
                </div>

                <div class="gallery-card">
                    <h3 class="gallery-label">SOUTHEASTERN</h3>
                    <button type="button" class="gallery-item" data-caption="Southeastern District">
                        <img src="assets/southeastern-district.png"
                            alt="Map of the southeastern district of The Hollow Realm" loading="lazy">
                    </button>
                </div>
            </div>
        </section>

    </main>


    <!-- ===================================================
         MAP LIGHTBOX
    =================================================== -->
    <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Enlarged map">
        <button type="button" class="lightbox-close" aria-label="Close enlarged map">&times;</button>
        <img class="lightbox-img" id="lightbox-img" src="" alt="">
        <p class="lightbox-caption" id="lightbox-caption"></p>
    </div>


    <!-- ===================================================
         FOOTER
    =================================================== -->
    <footer>

        <p>© 2025 M. Rafay. All rights reserved.</p>

        <div class="socials" aria-label="Social media links">
            <i class="fa-brands fa-facebook-f" title="Facebook" tabindex="0" role="link" aria-label="Facebook"></i>
            <i class="fa-brands fa-x-twitter" title="X/Twitter" tabindex="0" role="link" aria-label="X / Twitter"></i>
            <i class="fa-brands fa-instagram" title="Instagram" tabindex="0" role="link" aria-label="Instagram"></i>
            <i class="fa-brands fa-youtube" title="YouTube" tabindex="0" role="link" aria-label="YouTube"></i>
        </div>

    </footer>


    <!-- JavaScript -->
    <script src="js/script.js"></script>

</body>

</html>
