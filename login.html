<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Log in to your Hollow Realm account.">

    <title>Login | The Hollow Realm</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Cinzel+Decorative:wght@400;700&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <!-- Main Stylesheet -->
    <link rel="icon" type="image/png" href="assets/favicon.png">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- ===== LAYERED BACKGROUND ATMOSPHERE ===== -->
    <div class="background" aria-hidden="true"></div>
    <div class="fog"        aria-hidden="true"></div>
    <div class="fog-2"      aria-hidden="true"></div>


    <!-- ===================================================
         NAVBAR
    =================================================== -->
    <header>
        <nav class="navbar" role="navigation" aria-label="Primary Navigation">

            <a class="logo" href="index.html" aria-label="The Hollow Realm Home">
                THE HOLLOW REALM
            </a>

            <ul class="nav-links">
                <li><a href="index.html" data-nav>HOME</a></li>
                <li><a href="about.html" data-nav>ABOUT</a></li>
                <li><a href="world.html" data-nav>WORLD</a></li>
                <li><a href="characters.html" data-nav>CHARACTERS</a></li>
                <li><a href="gallery.html" data-nav>GALLERY</a></li>
            </ul>

            <button class="menu-toggle" type="button" aria-label="Open navigation menu" aria-expanded="false">
                <i class="fa-solid fa-bars" aria-hidden="true"></i>
            </button>

            <a class="login-btn" href="login.html" data-login-btn aria-label="Login to your account">
                <i class="fa-regular fa-user" aria-hidden="true"></i>
                LOGIN
            </a>

        </nav>
    </header>


    <main>

        <section class="page-hero" aria-labelledby="page-title" style="min-height: 30vh; padding-bottom: 20px;">
            <p class="eyebrow">ACCOUNT</p>
            <h1 id="page-title">LOG IN</h1>
        </section>

        <section class="auth-wrap">
            <div class="auth-card">
                <p class="form-note">
                    Demo mode — enter any email and password to continue.
                </p>

                <form id="login-form" novalidate>
                    <div class="field">
                        <label for="login-email">EMAIL</label>
                        <input type="email" id="login-email" name="email" placeholder="you@example.com" autocomplete="email">
                    </div>
                    <div class="field">
                        <label for="login-password">PASSWORD</label>
                        <input type="password" id="login-password" name="password" placeholder="••••••••" autocomplete="current-password">
                    </div>
                    <button type="submit" class="primary-btn submit-btn">
                        <i class="fa-solid fa-right-to-bracket" aria-hidden="true"></i>
                        LOG IN
                    </button>
                    <p class="form-message" id="login-message"></p>
                </form>
            </div>
        </section>

    </main>


    <!-- ===================================================
         FOOTER
    =================================================== -->
    <footer>

        <p>© 2025 M. Rafay. All rights reserved.</p>

        <div class="socials" aria-label="Social media links">
            <i class="fa-brands fa-facebook-f"  title="Facebook"  tabindex="0" role="link" aria-label="Facebook"></i>
            <i class="fa-brands fa-x-twitter"   title="X/Twitter" tabindex="0" role="link" aria-label="X / Twitter"></i>
            <i class="fa-brands fa-instagram"   title="Instagram" tabindex="0" role="link" aria-label="Instagram"></i>
            <i class="fa-brands fa-youtube"     title="YouTube"   tabindex="0" role="link" aria-label="YouTube"></i>
        </div>

    </footer>


    <!-- JavaScript -->
    <script src="js/script.js"></script>

</body>

</html>
